<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-light">

<!-- Horní Lišta a Sidebar -->
<div th:replace="~{fragments/navigation :: navbar}"></div>

<div class="container px-3 my-3">

  <!-- ZÁHLAVÍ STRÁNKY -->
  <div class="card shadow-sm border-0 mb-4 rounded-lg">
    <div class="card-body p-3 d-flex justify-content-between align-items-center">
      <div>
        <small class="text-muted d-block font-weight-bold text-uppercase">Soutěž & Síň slávy</small>
        <h3 class="font-weight-bold text-dark m-0">
          <i class="fas fa-award text-warning mr-2"></i>Trofeje & Odznaky
        </h3>
      </div>
      <div class="text-right">
                    <span class="badge badge-success px-3 py-2 font-weight-bold fs-6 rounded-pill">
                        <i class="fas fa-sync-alt mr-1"></i>Živé hodnocení
                    </span>
      </div>
    </div>
  </div>

  <!-- SEZNAM TROFEJÍ (MŘÍŽKA KARET PRO MOBIL I DESKTOP) -->
  <div class="row px-1">

    <div class="col-12 col-md-6 col-lg-4 mb-3 px-2" th:each="badge : ${badges}">
      <div class="card shadow-sm border-0 rounded-lg overflow-hidden h-100 catch-card-hover"
           th:classappend="${badge.winnerName == 'Zatím nikdo' or badge.winnerName == null ? 'bg-white opacity-75' : 'bg-white'}">

        <div class="card-body p-3 d-flex flex-column justify-content-between">

          <!-- Horní část: Ikona + Název + Popis -->
          <div>
            <div class="d-flex align-items-center mb-2">
              <div class="rounded-circle bg-light border d-flex align-items-center justify-content-center mr-3 shadow-sm"
                   style="width: 50px; height: 50px; font-size: 1.8rem; flex-shrink: 0;">
                <span th:text="${badge.icon}">📏</span>
              </div>
              <div>
                <h5 class="font-weight-bold text-dark m-0" th:text="${badge.title}">Pán metrů</h5>
                <small class="text-muted d-block" th:text="${badge.description}">Nejdelší ulovená ryba výpravy</small>
              </div>
            </div>
          </div>

          <hr class="my-2 border-light">

          <!-- Spodní část: Držitel + Hodnota -->
          <div class="d-flex justify-content-between align-items-center mt-1">

            <!-- DRŽITEL -->
            <div>
              <small class="text-muted d-block font-weight-bold mb-1">Aktuální držitel:</small>

              <!-- Má držitele -> Odkaz na lovce -->
              <a th:if="${badge.winnerName != 'Zatím nikdo' and badge.winnerName != null}"
                 th:href="@{/catch/hunter/{id}(id=${badge.winnerId != null ? badge.winnerId : badge.winnerName})}"
                 class="badge badge-warning text-dark font-weight-bold px-3 py-2 fs-6 rounded-pill text-decoration-none shadow-sm">
                <i class="fas fa-crown mr-1 text-danger"></i>
                <span th:text="${badge.winnerName}">David</span>
              </a>

              <!-- Nemá držitele -->
              <span th:if="${badge.winnerName == 'Zatím nikdo' or badge.winnerName == null}"
                    class="badge badge-light text-muted border px-3 py-2 rounded-pill font-weight-bold">
                                    Zatím nikdo
                                </span>
            </div>

            <!-- HODNOTA / REKORD -->
            <div class="text-right">
              <small class="text-muted d-block font-weight-bold mb-1">Výkon:</small>
              <strong class="text-dark fs-6"
                      th:text="${badge.value != null and !badge.value.isEmpty() ? badge.value : '-'}">
                98 cm (Kapr)
              </strong>
            </div>

          </div>

        </div>
      </div>
    </div>

    <!-- PRÁZDNÝ STAV -->
    <div th:if="${badges == null or #lists.isEmpty(badges)}" class="col-12 text-center py-5 text-muted">
      <i class="fas fa-award fa-3x mb-3 text-muted opacity-50"></i>
      <h5>Žádné trofeje zatím nebyly načteny.</h5>
    </div>

  </div>

</div>

</body>
</html>

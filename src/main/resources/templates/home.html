<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-light">

<!-- Horní Lišta a Sidebar -->
<div th:replace="~{fragments/navigation :: navbar}"></div>

<div class="container px-3 my-3">

    <!-- KARTA STATISTIKY RYZÍHO STAVU (SUMÁŘ) -->
    <div class="card bg-dark text-white shadow-sm border-0 mb-4 rounded-lg">
        <div class="card-body p-3">
            <div class="row text-center">
                <div class="col-6 border-right border-secondary">
                    <span class="text-muted small text-uppercase d-block">Celkem ryb</span>
                    <span class="h3 font-weight-bold text-success mb-0" th:text="${allCatchCount}">155</span>
                    <small class="text-white-50"> ks</small>
                </div>
                <div class="col-6">
                    <span class="text-muted small text-uppercase d-block">Celková délka</span>
                    <span class="h3 font-weight-bold text-info mb-0" th:text="${#numbers.formatDecimal(allCatchSize, 0, 'WHITESPACE', 0, 'POINT')}">1000</span>
                    <small class="text-white-50"> cm</small>
                </div>
            </div>
        </div>
    </div>

    <!-- FORMULÁŘ: NOVÝ ÚLOVEK -->
    <div id="novy-ulovek" class="card shadow-lg border-0 rounded-lg mb-4">
        <div class="card-header bg-success text-white py-3">
            <h5 class="m-0 font-weight-bold"><i class="fas fa-plus-circle mr-2"></i>Zapsat nový úlovek</h5>
        </div>
        <div class="card-body p-3">

            <form action="#" th:action="@{/catch/new}" th:object="${newCatchDTO}" method="post" enctype="multipart/form-data">

                <!-- LOVEC & RYBA V JEDNOM RÁDKU -->
                <div class="form-row">
                    <div class="form-group col-6">
                        <label for="hunterId" class="font-weight-bold small text-muted">Lovec *</label>
                        <select th:field="*{hunterId}" id="hunterId" class="form-control form-control-lg" required>
                            <option th:each="hunter : ${allHunters}" th:value="${hunter.id}" th:text="${hunter.name}"/>
                        </select>
                        <small class="text-danger" th:if="${#fields.hasErrors('hunterId')}" th:errors="*{hunterId}">Chyba lovce</small>
                    </div>

                    <div class="form-group col-6">
                        <label for="fishTypeId" class="font-weight-bold small text-muted">Ryba *</label>
                        <select th:field="*{fishTypeId}" id="fishTypeId" class="form-control form-control-lg" required>
                            <option th:each="fish : ${allFishTypes}" th:value="${fish.id}" th:text="${fish.type}"/>
                        </select>
                        <small class="text-danger" th:if="${#fields.hasErrors('fishTypeId')}" th:errors="*{fishTypeId}">Chyba ryby</small>
                    </div>
                </div>

                <!-- VELIKOST & VÁHA -->
                <div class="form-row">
                    <div class="form-group col-6">
                        <label for="size" class="font-weight-bold small text-muted">Délka (cm)</label>
                        <input id="size" class="form-control form-control-lg" type="number" th:field="*{size}" min="0" placeholder="0"/>
                        <small class="text-danger" th:if="${#fields.hasErrors('size')}" th:errors="*{size}">Chyba velikosti</small>
                    </div>

                    <div class="form-group col-6">
                        <label for="weight" class="font-weight-bold small text-muted">Váha (g)</label>
                        <input id="weight" class="form-control form-control-lg" type="number" th:field="*{weight}" min="0" placeholder="0"/>
                        <small class="text-danger" th:if="${#fields.hasErrors('weight')}" th:errors="*{weight}">Chyba váhy</small>
                    </div>
                </div>

                <!-- ČAS -->
                <div class="form-group">
                    <label for="time" class="font-weight-bold small text-muted">Čas ulovení</label>
                    <input id="time" class="form-control" type="datetime-local" th:field="*{time}"/>
                    <small class="text-danger" th:if="${#fields.hasErrors('time')}" th:errors="*{time}">Chyba času</small>
                </div>

                <!-- FOTKA (Velké tlačítko pro foťák na mobilu) -->
                <div class="form-group">
                    <label for="image" class="font-weight-bold small text-muted">Fotka ryby</label>
                    <div class="custom-file">
                        <input type="file" name="image" id="image" accept="image/*" capture="environment" class="custom-file-input">
                        <label class="custom-file-label" for="image" data-browse="Vybrat">Vyfotit / Přidat fotku</label>
                    </div>
                </div>

                <!-- POZNÁMKA -->
                <div class="form-group">
                    <label for="note" class="font-weight-bold small text-muted">Poznámka</label>
                    <input id="note" class="form-control" type="text" th:field="*{note}" placeholder="Nástraha, revír..."/>
                    <small class="text-danger" th:if="${#fields.hasErrors('note')}" th:errors="*{note}">Chyba poznámky</small>
                </div>

                <button type="submit" class="btn btn-success btn-lg btn-block font-weight-bold shadow-sm mt-4">
                    <i class="fas fa-check-circle mr-2"></i>Uložit úlovek
                </button>
            </form>

        </div>
    </div>

</div>

<!-- Bootstrap & Popper JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

<!-- Zobrazení názvu vybraného souboru u foto inputu -->
<script>
    $(".custom-file-input").on("change", function() {
        var fileName = $(this).val().split("\\").pop();
        $(this).siblings(".custom-file-label").addClass("selected").html(fileName);
    });
</script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const timeInput = document.getElementById('time');
        // Pokud pole zatím nemá vyplněnou hodnotu, předvyplníme aktuální lokální čas
        if (timeInput && !timeInput.value) {
            const now = new Date();
            // Převedení na ISO formát požadovaný pro datetime-local (YYYY-MM-DDTHH:mm)
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            timeInput.value = now.toISOString().slice(0, 16);
        }
    });
</script>

</body>
</html>

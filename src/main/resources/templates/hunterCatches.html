<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-light">

<!-- Horní Lišta a Sidebar -->
<div th:replace="~{fragments/navigation :: navbar}"></div>

<div class="container px-3 my-3">

  <!-- ZÁHLAVÍ FILTRU (LOVEČ + HLAVNÍ METRIKA) -->
  <div class="card shadow-sm border-0 mb-3 rounded-lg">
    <div class="card-body p-3 d-flex justify-content-between align-items-center">
      <div>
        <small class="text-muted d-block font-weight-bold text-uppercase">Přehled pro lovce</small>
        <h3 class="font-weight-bold text-dark m-0">
          <i class="fas fa-user text-success mr-2"></i><span th:text="${hunter}">Jan</span>
        </h3>
      </div>
      <div class="text-right">
                    <span class="badge badge-success px-3 py-2 font-weight-bold fs-6 rounded-pill">
                        Zobrazeno úlovků: <span id="visible-count" th:text="${allCatches != null ? allCatches.size() : 0}">0</span>
                    </span>
      </div>
    </div>
  </div>

  <!-- FILTROVACÍ PANEL (RYBA + DATUM) -->
  <div class="card shadow-sm border-0 mb-4 rounded-lg">
    <div class="card-body p-3 bg-white">
      <div class="row align-items-end">

        <!-- 1. FILTR PODLE RYBY -->
        <div class="col-12 col-md-4 mb-2 mb-md-0">
          <label for="filterFish" class="small font-weight-bold text-muted mb-1">
            <i class="fas fa-fish mr-1 text-info"></i>Druh ryby:
          </label>
          <select id="filterFish" class="form-control form-control-sm font-weight-bold">
            <option value="all">-- Všechny ryby --</option>
            <option th:each="f : ${#sets.toSet(allCatches.![fish])}"
                    th:value="${f}"
                    th:text="${f}">Kapr</option>
          </select>
        </div>

        <!-- 2. DATUM OD -->
        <div class="col-6 col-md-3 mb-2 mb-md-0">
          <label for="filterDateFrom" class="small font-weight-bold text-muted mb-1">
            <i class="far fa-calendar-alt mr-1"></i>Datum od:
          </label>
          <input type="date" id="filterDateFrom" class="form-control form-control-sm">
        </div>

        <!-- 3. DATUM DO -->
        <div class="col-6 col-md-3 mb-2 mb-md-0">
          <label for="filterDateTo" class="small font-weight-bold text-muted mb-1">
            <i class="far fa-calendar-alt mr-1"></i>Datum do:
          </label>
          <input type="date" id="filterDateTo" class="form-control form-control-sm">
        </div>

        <!-- 4. RESET FILTRŮ -->
        <div class="col-12 col-md-2 text-right">
          <button id="btnResetFilters" class="btn btn-sm btn-outline-danger btn-block font-weight-bold">
            <i class="fas fa-undo mr-1"></i>Reset
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- SEZNAM KARET ÚLOVKŮ -->
  <div class="row px-1" id="cards-container">

    <div class="col-12 col-md-6 col-lg-4 mb-3 px-2 catch-item"
         th:each="c : ${allCatches}"
         th:data-fish="${c.fish}"
         th:data-date="${c.timestamp != null ? #temporals.format(c.timestamp, 'yyyy-MM-dd') : ''}">

      <!-- Odkaz na detail úlovku /catch/{id} -->
      <a th:href="@{/catch/{id}(id=${c.id})}" class="text-decoration-none text-dark d-block h-100">

        <div class="card shadow-sm border-0 rounded-lg overflow-hidden h-100 catch-card-hover">

          <div class="card-body p-3">

            <!-- Čas a Ryba -->
            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="small font-weight-bold text-muted">
                                    <i class="far fa-clock mr-1"></i><span th:text="${c.timestamp != null ? #temporals.format(c.timestamp, 'dd.MM.yyyy HH:mm') : ''}">01.06. 14:30</span>
                                </span>
              <span class="badge badge-info font-weight-bold px-2 py-1" th:text="${c.fish}">Kapr</span>
            </div>

            <!-- Rozměry: Délka a Váha -->
            <div class="row text-center bg-light rounded py-2 mx-0 my-2 border">
              <div class="col-6 border-right">
                <small class="text-muted d-block">Délka</small>
                <strong class="text-dark fs-5" th:text="${c.size != null ? c.size + ' cm' : '-'}">65 cm</strong>
              </div>
              <div class="col-6">
                <small class="text-muted d-block">Váha</small>
                <strong class="text-dark fs-5" th:text="${c.weight != null ? c.weight + ' g' : '-'}">4500 g</strong>
              </div>
            </div>

            <!-- Poznámka a Body -->
            <div class="d-flex justify-content-between align-items-center mt-2">
              <p class="card-text small text-muted mb-0 text-truncate mr-2" th:if="${c.note != null and !c.note.isEmpty()}">
                <i class="fas fa-comment-dots mr-1"></i><span th:text="${c.note}">Poznámka</span>
              </p>
              <span th:if="${c.note == null or c.note.isEmpty()}"></span>
              <small class="text-warning font-weight-bold" th:if="${c.points != null}">
                <i class="fas fa-star mr-1"></i><span th:text="${c.points}">10</span> b
              </small>
            </div>

          </div>

        </div>
      </a>

    </div>

    <!-- Hláška pokud nic neodpovídá filtru -->
    <div id="no-results-msg" class="col-12 text-center py-5 text-muted" style="display: none;">
      <i class="fas fa-search fa-3x mb-3 text-muted opacity-50"></i>
      <h5>Zadanému filtru neodpovídají žádné úlovky.</h5>
    </div>

    <!-- Pokud lovci nemají obecně žádné úlovky -->
    <div th:if="${allCatches == null or #lists.isEmpty(allCatches)}" class="col-12 text-center py-5 text-muted">
      <i class="fas fa-fish fa-3x mb-3 text-muted opacity-50"></i>
      <h5>Tento lovec zatím nemá zapsané žádné úlovky.</h5>
    </div>

  </div>

</div>

<!-- SKRIPTY & STYLY -->
<script>
  $(document).ready(function() {

    // AUTOMATICKÉ ZJIŠTĚNÍ MIN A MAX DATUMU Z KARET
    var dates = [];
    $('.catch-item').each(function() {
      var d = $(this).attr('data-date');
      if (d) {
        dates.push(d);
      }
    });

    if (dates.length > 0) {
      dates.sort(); // Seřadí řetězce YYYY-MM-DD
      var minDate = dates[0];
      var maxDate = dates[dates.length - 1];

      // Nastaví dynamicky limity na HTML kalendáře
      $('#filterDateFrom, #filterDateTo').attr('min', minDate).attr('max', maxDate);
    }

    // HLAVNÍ FILTRUJÍCÍ FUNKCE
    function filterCatches() {
      var selectedFish = $('#filterFish').val();
      var dateFrom = $('#filterDateFrom').val();
      var dateTo = $('#filterDateTo').val();

      var visibleCount = 0;

      $('.catch-item').each(function() {
        var $item = $(this);
        var itemFish = $item.attr('data-fish');
        var itemDate = $item.attr('data-date');

        var matchFish = (selectedFish === 'all' || itemFish === selectedFish);
        var matchDateFrom = (!dateFrom || itemDate >= dateFrom);
        var matchDateTo = (!dateTo || itemDate <= dateTo);

        if (matchFish && matchDateFrom && matchDateTo) {
          $item.show();
          visibleCount++;
        } else {
          $item.hide();
        }
      });

      // Aktualizuje počet zobrazených karet
      $('#visible-count').text(visibleCount);

      // Zobrazí nebo skryje hlášku "Nenalezeno"
      if (visibleCount === 0 && $('.catch-item').length > 0) {
        $('#no-results-msg').show();
      } else {
        $('#no-results-msg').hide();
      }
    }

    // REAKCE NA ZMĚNY
    $('#filterFish, #filterDateFrom, #filterDateTo').on('change input', function() {
      filterCatches();
    });

    // RESET BUTTON
    $('#btnResetFilters').on('click', function() {
      $('#filterFish').val('all');
      $('#filterDateFrom').val('');
      $('#filterDateTo').val('');
      filterCatches();
    });

  });
</script>
</body>
</html>

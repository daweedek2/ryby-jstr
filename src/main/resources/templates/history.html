<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-light">

<!-- Horní Lišta a Sidebar -->
<div th:replace="~{fragments/navigation :: navbar}"></div>

<div class="container px-3 my-3">

  <!-- ZÁHLAVÍ STRÁNKY -->
  <div class="card shadow-sm border-0 mb-4 rounded-lg">
    <div class="card-body p-3 d-flex justify-content-between align-items-center">
      <div>
        <small class="text-muted d-block font-weight-bold text-uppercase">Přehled ročníků</small>
        <h3 class="font-weight-bold text-dark m-0">
          <i class="fas fa-history text-primary mr-2"></i>Historie výprav
        </h3>
      </div>
      <div class="text-right">
                    <span class="badge badge-primary px-3 py-2 font-weight-bold fs-6 rounded-pill">
                        Výprav: <span th:text="${historyList != null ? historyList.size() : 0}">0</span>
                    </span>
      </div>
    </div>
  </div>

  <!-- MŘÍŽKA ROČNÍKŮ -->
  <div class="row px-1">

    <div class="col-12 col-md-6 mb-4 px-2" th:each="history : ${historyList}">
      <div class="card shadow-sm border-0 rounded-lg overflow-hidden h-100">

        <!-- Hlavička karty s rokem a termínem -->
        <div class="card-header bg-dark text-white p-3 d-flex justify-content-between align-items-center">
          <h4 class="font-weight-bold m-0 fs-5">
            <i class="far fa-calendar-alt text-primary mr-2"></i>
            <span th:text="${history.year}">2024</span>
          </h4>
          <span class="badge badge-light text-dark font-weight-bold px-3 py-2 rounded-pill"
                th:text="${history.termin}">10.8. - 17.8.</span>
        </div>

        <div class="card-body p-3 d-flex flex-column justify-content-between">

          <!-- Statistiky výpravy (Ryby a Celková délka) -->
          <div class="row text-center bg-light rounded py-2 mx-0 mb-3 border">
            <div class="col-6 border-right">
              <small class="text-muted d-block font-weight-bold text-uppercase">Počet ryb</small>
              <strong class="text-primary fs-4" th:text="|${history.totalFishCount} ks|">120 ks</strong>
            </div>
            <div class="col-6">
              <small class="text-muted d-block font-weight-bold text-uppercase">Celkem metrů</small>
              <strong class="text-success fs-4"
                      th:text="|${#numbers.formatDecimal(history.totalFishSize / 100.0, 1, 'WHITESPACE', 1, 'POINT')} m|">120.5 m</strong>
            </div>
          </div>

          <!-- Účastníci a druhy ryb -->
          <div class="mb-2">
            <div class="mb-2" th:if="${history.hunterNames != null}">
              <small class="text-muted d-block font-weight-bold text-uppercase mb-1">
                <i class="fas fa-users text-warning mr-1"></i>Lovci:
              </small>
              <p class="text-dark font-weight-bold mb-0 small" th:text="${history.hunterNames}">David, Jirka, Tomáš</p>
            </div>

            <div th:if="${history.fishTypeNames != null}">
              <small class="text-muted d-block font-weight-bold text-uppercase mb-1">
                <i class="fas fa-fish text-info mr-1"></i>Ulovené druhy:
              </small>
              <p class="text-muted mb-0 small" th:text="${history.fishTypeNames}">Kapr, Jeseter, Amur</p>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- Pokud historie neobsahuje žádné ročníky -->
    <div th:if="${historyList == null or #lists.isEmpty(historyList)}" class="col-12 text-center py-5 text-muted">
      <i class="fas fa-history fa-3x mb-3 text-muted opacity-50"></i>
      <h5>Žádná historie výprav nebyla nalezena.</h5>
    </div>

  </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-light">

<!-- Horní Lišta a Sidebar -->
<div th:replace="~{fragments/navigation :: navbar}"></div>

<div class="container px-3 my-3">

    <!-- OVLÁDACÍ PANEL: Název + Filtr podle Lovce -->
    <div class="card shadow-sm border-0 mb-3 rounded-lg">
        <div class="card-body p-2 d-flex justify-content-between align-items-center">

            <h5 class="font-weight-bold text-dark m-0 pl-2">
                <i class="fas fa-fish text-success mr-2"></i>Přehled úlovků
            </h5>

            <!-- Filtr podle Lovce -->
            <div class="dropdown">
                <button class="btn btn-outline-secondary btn-sm dropdown-toggle font-weight-bold" type="button" id="hunterFilterBtn" data-toggle="dropdown">
                    <i class="fas fa-filter mr-1"></i>Lovec
                </button>
                <div class="dropdown-menu dropdown-menu-right shadow border-0">
                    <a class="dropdown-item filter-hunter active" href="#" data-hunter="all">Všichni lovci</a>
                    <div class="dropdown-divider"></div>
                    <a class="dropdown-item filter-hunter" href="#" th:each="h : ${allHunters}"
                       th:data-hunter="${h.name != null ? h.name : h}" th:text="${h.name != null ? h.name : h}">Lovec</a>
                </div>
            </div>

        </div>
    </div>

    <!-- FOTOGALERIE ÚLOVKŮ -->
    <div class="row px-1" id="cards-container">
        <div class="col-12 col-md-6 col-lg-4 mb-3 px-2 catch-item"
             th:each="c : ${catches}"
             th:data-hunter-name="${c.hunter}">

            <!-- Odkaz obalující celou kartu -> leads to /catch/{id} -->
            <a th:href="@{/catch/{id}(id=${c.id})}" class="text-decoration-none text-dark d-block h-100">

                <div class="card shadow-sm border-0 rounded-lg overflow-hidden h-100 catch-card-hover">

                    <!-- Náhled fotky -->
                    <div class="position-relative bg-dark text-center d-flex align-items-center justify-content-center" style="min-height: 200px; max-height: 280px; overflow: hidden;">

                        <img th:if="${c.imageIds != null and !#sets.isEmpty(c.imageIds)}"
                             th:src="@{/image/{id}(id=${new java.util.ArrayList(c.imageIds)[0]})}"
                             loading="lazy"
                             class="card-img-top w-100 h-100" style="object-fit: cover;" alt="Fotka úlovku">

                        <div th:if="${c.imageIds == null or #sets.isEmpty(c.imageIds)}" class="py-5 text-muted">
                            <i class="fas fa-fish fa-3x mb-2 d-block"></i>
                            <small>Bez fotky</small>
                        </div>

                        <!-- Odznak s časem -->
                        <span class="badge badge-dark position-absolute p-2" style="top: 10px; right: 10px; opacity: 0.85;"
                              th:text="${c.timestamp != null ? #temporals.format(c.timestamp, 'dd.MM. HH:mm') : ''}">
                            01.06. 14:30
                        </span>
                    </div>

                    <!-- Detail úlovku -->
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h5 class="card-title font-weight-bold text-dark m-0" th:text="${c.fish}">Kapr</h5>
                            <span class="badge badge-success font-weight-bold px-2 py-1" th:text="${c.hunter}">Lovec</span>
                        </div>

                        <div class="row text-center bg-light rounded py-2 mx-0 my-2 border">
                            <div class="col-6 border-right">
                                <small class="text-muted d-block">Délka</small>
                                <strong class="text-dark fs-5" th:text="${c.size != null ? c.size + ' cm' : '-'}">65 cm</strong>
                            </div>
                            <div class="col-6">
                                <small class="text-muted d-block">Váha</small>
                                <strong class="text-dark fs-5" th:text="${c.weight != null ? c.weight + ' g' : '-'}">4500 g</strong>
                            </div>
                        </div>

                        <p class="card-text small text-muted mb-0" th:if="${c.note != null and !c.note.isEmpty()}">
                            <i class="fas fa-comment-dots mr-1"></i><span th:text="${c.note}">Poznámka</span>
                        </p>
                    </div>

                </div>
            </a>
        </div>
    </div>

    <!-- TLAČÍTKO NAČÍST DALŠÍ -->
    <div class="text-center my-4" id="load-more-wrapper" th:style="${nextPhotoIndex > currentPage ? '' : 'display:none;'}">
        <button id="btn-load-more"
                th:data-next-page="${nextPhotoIndex}"
                class="btn btn-outline-success btn-lg rounded-pill font-weight-bold px-4 shadow-sm">
            <i class="fas fa-arrow-down mr-2"></i>Načíst další úlovky
        </button>
    </div>

</div>

<!-- SKRIPTY -->
<script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

<script>
    $(document).ready(function() {
        var activeHunter = 'all';

        // TLAČÍTKO NAČÍST DALŠÍ ÚLOVKY
        // TLAČÍTKO NAČÍST DALŠÍ ÚLOVKY
        $('#btn-load-more').on('click', function() {
            var $btn = $(this);
            var currentPage = parseInt($btn.attr('data-next-page'));

            $btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin mr-2"></i>Načítám...');

            $.ajax({
                url: '/allCatches?page=' + currentPage,
                type: 'GET',
                success: function(data) {
                    var $response = $(data);

                    // 1. Najdeme a připojíme nové karty
                    var $newCards = $response.find('#cards-container .catch-item');
                    if ($newCards.length > 0) {
                        $('#cards-container').append($newCards);
                    }

                    // 2. Najdeme nové tlačítko v odpovědi
                    var $newBtn = $response.find('#btn-load-more');

                    applyHunterFilter(activeHunter);

                    if ($newBtn.length > 0) {
                        var newNextPage = parseInt($newBtn.attr('data-next-page'));

                        // Pokud nám backend vrátil vyšší číslo další stránky, aktualizujeme tlačítko
                        if (newNextPage > currentPage) {
                            $btn.attr('data-next-page', newNextPage);
                            $btn.prop('disabled', false).html('<i class="fas fa-arrow-down mr-2"></i>Načíst další úlovky');
                        } else {
                            // Jsme na konci seznamu -> tlačítko schováme
                            $('#load-more-wrapper').hide();
                        }
                    } else {
                        $('#load-more-wrapper').hide();
                    }
                },
                error: function() {
                    alert('Chyba při načítání dalších úlovků.');
                    $btn.prop('disabled', false).html('<i class="fas fa-arrow-down mr-2"></i>Načíst další úlovky');
                }
            });
        });

        // FILTR PODLE LOVCE
        $('.filter-hunter').on('click', function(e) {
            e.preventDefault();
            $('.filter-hunter').removeClass('active');
            $(this).addClass('active');

            activeHunter = $(this).data('hunter');
            applyHunterFilter(activeHunter);
        });

        function applyHunterFilter(hunter) {
            if (hunter === 'all') {
                $('.catch-item').show();
                $('#hunterFilterBtn').html('<i class="fas fa-filter mr-1"></i>Všichni');
            } else {
                $('.catch-item').hide();
                $('.catch-item[data-hunter-name="' + hunter + '"]').show();
                $('#hunterFilterBtn').html('<i class="fas fa-user mr-1"></i>' + hunter);
            }
        }
    });
</script>
</body>
</html>

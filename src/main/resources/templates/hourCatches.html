<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-light">

<!-- Horní Lišta a Sidebar -->
<div th:replace="~{fragments/navigation :: navbar}"></div>

<div class="container px-3 my-3">

  <!-- ZÁHLAVÍ (HODINA + POČET ÚLOVKŮ) -->
  <div class="card shadow-sm border-0 mb-4 rounded-lg">
    <div class="card-body p-3 d-flex justify-content-between align-items-center">
      <div>
        <small class="text-muted d-block font-weight-bold text-uppercase">Hodinový přehled</small>
        <h3 class="font-weight-bold text-dark m-0">
          <i class="far fa-clock text-primary mr-2"></i>Úlovky v <span th:text="|${hour}:00|">12:00</span>
        </h3>
      </div>
      <div class="text-right">
                    <span class="badge badge-primary px-3 py-2 font-weight-bold fs-6 rounded-pill">
                        Celkem: <span th:text="${allCatches != null ? allCatches.size() : 0}">0</span>
                    </span>
      </div>
    </div>
  </div>

  <!-- SEZNAM KARET ÚLOVKŮ -->
  <div class="row px-1">

    <div class="col-12 col-md-6 col-lg-4 mb-3 px-2" th:each="c : ${allCatches}">

      <!-- Odkaz na detail úlovku /catch/{id} -->
      <a th:href="@{/catch/{id}(id=${c.id()})}" class="text-decoration-none text-dark d-block h-100">

        <div class="card shadow-sm border-0 rounded-lg overflow-hidden h-100 catch-card-hover">
          <div class="card-body p-3">

            <!-- Čas a Lovec -->
            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="small font-weight-bold text-muted">
                                    <i class="far fa-clock mr-1"></i><span th:text="${c.timestamp() != null ? #temporals.format(c.timestamp(), 'dd.MM.yyyy HH:mm') : ''}">01.06. 14:30</span>
                                </span>
              <span class="badge badge-success font-weight-bold px-2 py-1" th:text="${c.hunter()}">Lovec</span>
            </div>

            <!-- Ryba -->
            <div class="d-flex justify-content-between align-items-center my-2">
              <h5 class="font-weight-bold text-dark m-0">
                <i class="fas fa-fish text-info mr-2"></i><span th:text="${c.fish()}">Kapr</span>
              </h5>
              <small class="text-warning font-weight-bold" th:if="${c.points() != null}">
                <i class="fas fa-star mr-1"></i><span th:text="${c.points()}">10</span> b
              </small>
            </div>

            <!-- Rozměry: Délka a Váha -->
            <div class="row text-center bg-light rounded py-2 mx-0 my-2 border">
              <div class="col-6 border-right">
                <small class="text-muted d-block">Délka</small>
                <strong class="text-dark fs-5" th:text="${c.size() != null ? c.size() + ' cm' : '-'}">65 cm</strong>
              </div>
              <div class="col-6">
                <small class="text-muted d-block">Váha</small>
                <strong class="text-dark fs-5" th:text="${c.weight() != null ? c.weight() + ' g' : '-'}">4500 g</strong>
              </div>
            </div>

            <!-- Poznámka (pokud existuje) -->
            <div class="mt-2" th:if="${c.note() != null and !c.note().isEmpty()}">
              <p class="card-text small text-muted mb-0 text-truncate">
                <i class="fas fa-comment-dots mr-1"></i><span th:text="${c.note()}">Poznámka</span>
              </p>
            </div>

          </div>
        </div>
      </a>

    </div>

    <!-- Pokud v danou hodinu nebyly uloveny žádné ryby -->
    <div th:if="${allCatches == null or #lists.isEmpty(allCatches)}" class="col-12 text-center py-5 text-muted">
      <i class="far fa-clock fa-3x mb-3 text-muted opacity-50"></i>
      <h5>V tuto hodinu nebyly zaznamenány žádné úlovky.</h5>
    </div>

  </div>

</div>

</body>
</html>

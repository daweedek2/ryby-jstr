<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="navbar">
    <!-- Horní Lišta -->
    <nav class="navbar navbar-dark bg-dark sticky-top shadow-sm py-2 px-2">
        <div class="container-fluid d-flex flex-nowrap align-items-center justify-content-between p-0">

            <!-- Burger button -->
            <button class="btn btn-dark border-0 px-2 py-1 text-white" type="button" data-toggle="collapse" data-target="#sidebarMenu" style="flex-shrink: 0;">
                <i class="fas fa-bars fa-lg"></i>
            </button>

            <!-- Brand -->
            <a class="navbar-brand font-weight-bold m-0 p-0 text-white text-center" href="/" th:href="@{/}" style="font-family: 'Audiowide', cursive; font-size: 1.1rem; flex-grow: 1;">
                <i class="fas fa-fish text-success mr-1"></i>Jestřabice 2026
            </a>
        </div>
    </nav>

    <!-- Vysouvací Menu -->
    <div class="collapse bg-dark text-white p-3 shadow-lg" id="sidebarMenu" style="position: fixed; top: 48px; left: 0; right: 0; z-index: 1050; max-height: 85vh; overflow-y: auto;">
        <div class="list-group list-group-flush rounded bg-dark">

            <!-- 1. PŘEHLED ÚLOVKŮ -->
            <div class="text-uppercase text-muted font-weight-bold small px-3 mt-2 mb-1">Úlovky</div>
            <a th:href="@{/allCatches}" class="list-group-item list-group-item-action bg-dark text-white border-secondary py-2">
                <i class="fas fa-images text-info mr-3"></i>Přehled úlovků
            </a>
            <a th:href="@{/photos}" class="list-group-item list-group-item-action bg-dark text-white border-secondary py-2">
                <i class="fas fa-camera text-info mr-3"></i>Fotogalerie
            </a>

            <!-- 2. SOUTĚŽ & ŽEBŘÍČKY -->
            <div class="text-uppercase text-muted font-weight-bold small px-3 mt-3 mb-1">Soutěž & Žebříčky</div>
            <a th:href="@{/top}" class="list-group-item list-group-item-action bg-dark text-white border-secondary py-2">
                <i class="fas fa-trophy text-warning mr-3"></i>TOP Úlovky
            </a>
            <a th:href="@{/points}" class="list-group-item list-group-item-action bg-dark text-white border-secondary py-2">
                <i class="fas fa-table text-warning mr-3"></i>Tabulka bodů
            </a>
            <a th:href="@{/badges}" class="list-group-item list-group-item-action bg-dark text-white border-secondary py-2">
                <i class="fas fa-award text-warning mr-3"></i>Trofeje & Odznaky
            </a>

            <!-- 3. STATISTIKY -->
            <div class="text-uppercase text-muted font-weight-bold small px-3 mt-3 mb-1">Statistiky</div>
            <a th:href="@{/statistics}" class="list-group-item list-group-item-action bg-dark text-white border-secondary py-2">
                <i class="fas fa-users text-primary mr-3"></i>Statistiky celkem
            </a>
            <a th:href="@{/statistics/graph}" class="list-group-item list-group-item-action bg-dark text-white border-secondary py-2">
                <i class="fas fa-chart-line text-primary mr-3"></i>Grafy
            </a>
            <a th:href="@{/report}" class="list-group-item list-group-item-action bg-dark text-white border-secondary py-2">
                <i class="fas fa-file-alt text-primary mr-3"></i>Report
            </a>

            <!-- 4. HISTORIE -->
            <div class="text-uppercase text-muted font-weight-bold small px-3 mt-3 mb-1">Archiv</div>
            <a th:href="@{/history}" class="list-group-item list-group-item-action bg-dark text-white border-secondary py-2">
                <i class="fas fa-history text-secondary mr-3"></i>Historie
            </a>

        </div>
    </div>
</div>

</body>
</html>

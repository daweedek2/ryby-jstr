<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-light">

<!-- Horní Lišta a Sidebar -->
<div th:replace="~{fragments/navigation :: navbar}"></div>

<div class="container px-3 my-3">

  <!-- TLAČÍTKO ZPĚT -->
  <div class="mb-3">
    <a th:href="@{/allCatches}" class="btn btn-outline-secondary btn-sm font-weight-bold rounded-pill px-3 shadow-sm">
      <i class="fas fa-arrow-left mr-1"></i> Zpět na přehled
    </a>
  </div>

  <!-- ZÁHLAVÍ FILTRU (RYBA) -->
  <div class="card shadow-sm border-0 mb-4 rounded-lg">
    <div class="card-body p-3 d-flex justify-content-between align-items-center">
      <div>
        <small class="text-muted d-block font-weight-bold text-uppercase">Přehled pro rybu</small>
        <h3 class="font-weight-bold text-dark m-0">
          <i class="fas fa-fish text-info mr-2"></i><span th:text="${fish}">Kapr</span>
        </h3>
      </div>
      <div class="text-right">
                    <span class="badge badge-info px-3 py-2 font-weight-bold fs-6 rounded-pill">
                        Počet úlovků: <span th:text="${allCatches != null ? allCatches.size() : 0}">0</span>
                    </span>
      </div>
    </div>
  </div>

  <!-- SEZNAM KARET BEZ FOTEK -->
  <div class="row px-1" id="cards-container">

    <div class="col-12 col-md-6 col-lg-4 mb-3 px-2 catch-item" th:each="c : ${allCatches}">

      <!-- Odkaz na detail úlovku /catch/{id} -->
      <a th:href="@{/catch/{id}(id=${c.id})}" class="text-decoration-none text-dark d-block h-100">

        <div class="card shadow-sm border-0 rounded-lg overflow-hidden h-100 catch-card-hover">

          <div class="card-body p-3">

            <!-- Čas a Lovec -->
            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="small font-weight-bold text-muted">
                                    <i class="far fa-clock mr-1"></i><span th:text="${c.timestamp != null ? #temporals.format(c.timestamp, 'dd.MM.yyyy HH:mm') : ''}">01.06. 14:30</span>
                                </span>
              <span class="badge badge-success font-weight-bold px-2 py-1" th:text="${c.hunter}">Lovec</span>
            </div>

            <!-- Rozměry: Délka a Váha -->
            <div class="row text-center bg-light rounded py-2 mx-0 my-2 border">
              <div class="col-6 border-right">
                <small class="text-muted d-block">Délka</small>
                <strong class="text-dark fs-5" th:text="${c.size != null ? c.size + ' cm' : '-'}">65 cm</strong>
              </div>
              <div class="col-6">
                <small class="text-muted d-block">Váha</small>
                <strong class="text-dark fs-5" th:text="${c.weight != null ? c.weight + ' g' : '-'}">4500 g</strong>
              </div>
            </div>

            <!-- Poznámka a Body -->
            <div class="d-flex justify-content-between align-items-center mt-2">
              <p class="card-text small text-muted mb-0 text-truncate mr-2" th:if="${c.note != null and !c.note.isEmpty()}">
                <i class="fas fa-comment-dots mr-1"></i><span th:text="${c.note}">Poznámka</span>
              </p>
              <span th:if="${c.note == null or c.note.isEmpty()}"></span>
              <small class="text-warning font-weight-bold" th:if="${c.points != null}">
                <i class="fas fa-star mr-1"></i><span th:text="${c.points}">10</span> b
              </small>
            </div>

          </div>

        </div>
      </a>

    </div>

    <!-- Pokud nejsou žádné úlovky -->
    <div th:if="${allCatches == null or #lists.isEmpty(allCatches)}" class="col-12 text-center py-5 text-muted">
      <i class="fas fa-fish fa-3x mb-3 text-muted opacity-50"></i>
      <h5>Zatím nebyly zaznamenány žádné úlovky této ryby.</h5>
    </div>

  </div>

</div>

<!-- SKRIPTY & STYLY -->
<script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

<style>
  .catch-card-hover {
    transition: transform 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
  }
  .catch-card-hover:active,
  .catch-card-hover:hover {
    transform: translateY(-2px);
    box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15) !important;
  }
</style>
</body>
</html>
